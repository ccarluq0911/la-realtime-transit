services:
  kafka-controller:
    build: ./kafka
    networks:
      - default
    environment:
      CONFIG_FILE: /opt/kafka/config/controller1.properties
      KAFKA_CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_CONTROLLER_DIRECTORY_ID: ${KAFKA_CONTROLLER_DIRECTORY_ID}
      ROLE: controller
      KAFKA_OPTS: -javaagent:/opt/jmx_exporter/jmx_prometheus_javaagent.jar=11001:/opt/jmx_exporter/config.yml
    volumes:
      - ./kafka-server:/opt/kafka/config:ro
      - kafka_controller_data:/opt/kafka/data
      - ./jmx-exporter/kafka-jmx-config.yml:/opt/jmx_exporter/config.yml:ro
    user: root
    command: ["/opt/kafka/bin/start-kafka.sh"]
    ports:
      - "9096:9096"
      - "11001:11001"

  kafka-broker-1:
    build: ./kafka
    networks:
      - default
    environment:
      CONFIG_FILE: /opt/kafka/config/broker1.properties
      KAFKA_CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      ROLE: broker
      KAFKA_OPTS: -javaagent:/opt/jmx_exporter/jmx_prometheus_javaagent.jar=11005:/opt/jmx_exporter/config.yml
    volumes:
      - ./kafka-server:/opt/kafka/config:ro
      - kafka_broker1_data:/opt/kafka/data
      - ./jmx-exporter/kafka-jmx-config.yml:/opt/jmx_exporter/config.yml:ro
    user: root
    command: ["/opt/kafka/bin/start-kafka.sh"]
    depends_on:
      - kafka-controller
    ports:
      - "9092:9092"
      - "11005:11005"

  kafka-broker-2:
    build: ./kafka
    networks:
      - default
    environment:
      CONFIG_FILE: /opt/kafka/config/broker2.properties
      KAFKA_CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      ROLE: broker
      KAFKA_OPTS: -javaagent:/opt/jmx_exporter/jmx_prometheus_javaagent.jar=11006:/opt/jmx_exporter/config.yml
    volumes:
      - ./kafka-server:/opt/kafka/config:ro
      - kafka_broker2_data:/opt/kafka/data
      - ./jmx-exporter/kafka-jmx-config.yml:/opt/jmx_exporter/config.yml:ro
    user: root
    command: ["/opt/kafka/bin/start-kafka.sh"]
    depends_on:
      - kafka-controller
    ports:
      - "9093:9093"
      - "11006:11006"


  database:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

  vehicle-producer:
    build:
      context: .
      dockerfile: producer/Dockerfile
    networks:
      - default
    depends_on:
      - database
    environment:
      API_KEY: ${API_KEY}
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}

  hadoop-namenode:
    image: apache/hadoop:3.4.1
    user: root
    hostname: cluster-bda
    networks:
      default:
        aliases:
          - cluster-bda
          - namenode
    command: ["hdfs", "namenode"]
    ports:
      - "9870:9870"
      - "8020:8020"
    env_file:
      - ./hadoop/config
    environment:
      ENSURE_NAMENODE_DIR: "/tmp/hadoop-root/dfs/name"
    volumes:
      - hadoop_data:/tmp/hadoop-root
    healthcheck:
      test: ["CMD-SHELL", "hdfs dfsadmin -safemode get | grep -q OFF"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 30s

  hadoop-datanode:
    image: apache/hadoop:3.4.1
    hostname: hadoop-datanode
    user: root
    networks:
      - default
    depends_on:
      hadoop-namenode:
        condition: service_started
    command: ["hdfs", "datanode"]
    env_file:
      - ./hadoop/config
    volumes:
      - hadoop_data:/tmp/hadoop-root
    ports:
      - "9864:9864"
      - "9866:9866"

  hdfs-init:
    image: apache/hadoop:3.4.1
    user: root
    networks:
      - default
    depends_on:
      hadoop-namenode:
        condition: service_healthy
      hadoop-datanode:
        condition: service_started
    env_file:
      - ./hadoop/config
    volumes:
      - ./hadoop/hdfs-init.sh:/hdfs-init.sh:ro
    command: ["/bin/bash", "/hdfs-init.sh"]
    restart: "no"

  spark-master:
    image: spark:3.4.1
    hostname: spark-master
    networks:
      - default
    environment:
      SPARK_NO_DAEMONIZE: "1"
      SPARK_MASTER_HOST: spark-master
    command: ["/opt/spark/sbin/start-master.sh"]
    ports:
      - "7077:7077"
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  spark-worker-1:
    image: spark:3.4.1
    networks:
      - default
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      SPARK_NO_DAEMONIZE: "1"
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: 2G
    command: ["/opt/spark/sbin/start-worker.sh", "spark://spark-master:7077"]
    ports:
      - "8081:8081"

  spark-job:
    image: spark:3.4.1
    hostname: spark-job
    networks:
      - default
    depends_on:
      spark-master:
        condition: service_healthy
      spark-worker-1:
        condition: service_started
      kafka-broker-1:
        condition: service_started
      kafka-broker-2:
        condition: service_started
      hdfs-init:
        condition: service_completed_successfully
    volumes:
      - ./spark:/opt/spark-app:ro
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker-1:9092,kafka-broker-2:9093
      HDFS_NAMENODE: hdfs://cluster-bda:8020
      GTFS_DATA_PATH: hdfs:///bda/data/gtfs_bus
      OUTPUT_PATH: hdfs://cluster-bda:8020/bda/data/vehicle_delays/
      CHECKPOINT_PATH: hdfs://cluster-bda:8020/bda/data/vehicle_delays_chck/
    command:
      - driver
      - --master
      - spark://spark-master:7077
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.4.1
      - --conf
      - spark.hadoop.fs.defaultFS=hdfs://cluster-bda:8020
      - --conf
      - spark.jars.ivy=/tmp/.ivy2
      - --conf
      - spark.driver.host=spark-job
      - --conf
      - spark.driver.bindAddress=0.0.0.0
      - /opt/spark-app/spark_read.py

  prometheus:
    image: prom/prometheus:v2.53.4
    networks:
      - default
    depends_on:
      - kafka-controller
      - kafka-broker-1
      - kafka-broker-2
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus

  connector-init:
    image: curlimages/curl:latest
    networks:
      - default
    depends_on:
      kafka-connect-worker-1:
        condition: service_healthy
    volumes:
      - ./kafka-connect/mysql-vehicle-positions-source-connector.json:/connector.json:ro
      - ./kafka-connect/connector-init.sh:/connector-init.sh:ro
    command: ["/bin/sh", "/connector-init.sh"]
    restart: "no"

  kafka-connect-worker-1:
    build: ./kafka
    depends_on:
      - kafka-broker-1
      - kafka-broker-2
    networks:
      - default
    volumes:
      - ./kafka-connect:/opt/kafka/config:ro
      - ./kafka-connect/confluentinc-kafka-connect-jdbc-10.8.4:/opt/kafka/data/libs:ro
    command: ["/opt/kafka/bin/connect-distributed.sh", "/opt/kafka/config/worker1.properties"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/connectors || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    ports:
      - "8083:8083"

  kafka-connect-worker-2:
    build: ./kafka
    depends_on:
      - kafka-broker-1
      - kafka-broker-2
    networks:
      - default
    volumes:
      - ./kafka-connect:/opt/kafka/config:ro
      - ./kafka-connect/confluentinc-kafka-connect-jdbc-10.8.4:/opt/kafka/data/libs:ro
    command: ["/opt/kafka/bin/connect-distributed.sh", "/opt/kafka/config/worker2.properties"]
    ports:
      - "8084:8084"

networks:
  default:
    driver: bridge

volumes:
  kafka_controller_data:
  kafka_broker1_data:
  kafka_broker2_data:
  db_data:
  hadoop_data:
  prometheus_data:
